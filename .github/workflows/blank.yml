name: Build Hydra Studio Bergama APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hydra-Studio-Bergama.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Studio-Bergama-APK
          path: Hydra-Studio-Bergama.apk

      - name: Publish direct APK download on Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes 2>/dev/null || true
          gh release create latest-apk Hydra-Studio-Bergama.apk \
            --title "Hydra Studio Bergama APK" \
            --notes "APK compilé automatiquement depuis GitHub Actions." \
            --latest
